services:
  - type: web
    name: betvalue-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://betvalue-ai-mvp.j-imlemke014ny5.chatgpt.site
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: betvalue-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: betvalue-db
    plan: free
    region: frankfurt
    databaseName: betvalue
    user: betvalue
